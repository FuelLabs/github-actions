# Non-PR Helm OCI publish only (no is-pr / pr-number / Chart.yaml PR mutation).
# Bump third-party majors via PR after review (supply chain).
name: Helm publish (OCI)
description: Lint and push a Helm chart to an OCI registry using Chart.yaml version or an override.

inputs:
  chart-folder:
    description: Path to the Helm chart directory
    required: true
  registry-url:
    description: OCI registry URL for the chart (e.g. oci://ghcr.io/org/charts)
    required: true
  username:
    description: Registry username
    required: true
  access-token:
    description: Registry password or token. Caller should set from secrets — masked in logs.
    required: true
  chart-version:
    description: Override chart version (otherwise read from Chart.yaml)
    required: false
  force:
    description: 'true | false — force push'
    required: false
    default: 'false'
  helm-version:
    description: Helm CLI version for azure/setup-helm (e.g. v3.14.4 or latest)
    required: false
    default: v3.14.4

outputs:
  chart-version:
    description: Chart version that was published
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ inputs.helm-version }}

    - name: Determine chart version
      id: version
      shell: bash
      env:
        CHART_FOLDER: ${{ inputs.chart-folder }}
        CHART_VERSION_INPUT: ${{ inputs.chart-version }}
      run: |
        set -euo pipefail
        chart_yaml="${CHART_FOLDER}/Chart.yaml"
        if [ -n "$CHART_VERSION_INPUT" ]; then
          if [[ "$CHART_VERSION_INPUT" == *$'\n'* ]]; then
            echo "chart-version must be a single line" >&2
            exit 1
          fi
          CHART_VERSION="$CHART_VERSION_INPUT"
        else
          CHART_VERSION=$(grep '^version:' "$chart_yaml" | head -1 | sed 's/^version:[[:space:]]*//' | tr -d "'\"")
        fi
        if [[ "$CHART_VERSION" == *$'\n'* || "$CHART_VERSION" == *$'\r'* ]]; then
          echo "Chart version value must be a single line" >&2
          exit 1
        fi
        # Single-line value only; avoid printf interpreting % in version strings
        printf '%s\n' "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
        echo "Chart version: ${CHART_VERSION}"

    - name: Apply chart version override to Chart.yaml
      if: inputs.chart-version != ''
      shell: bash
      env:
        CHART_FOLDER: ${{ inputs.chart-folder }}
        CHART_VERSION: ${{ inputs.chart-version }}
      run: |
        set -euo pipefail
        chart_yaml="${CHART_FOLDER}/Chart.yaml"
        if [[ "$CHART_VERSION" == *$'\n'* ]]; then
          echo "chart-version must be a single line" >&2
          exit 1
        fi
        cp -a "$chart_yaml" "${chart_yaml}.pre-oci-publish.bak"
        tmp="${chart_yaml}.oci.publish.tmp"
        # awk: replace first top-level version line; avoids sed delimiter/injection in the value
        awk -v nver="$CHART_VERSION" 'BEGIN{done=0} /^version:/{if(!done){print "version: " nver; done=1; next}} 1' "$chart_yaml" > "$tmp" && mv "$tmp" "$chart_yaml"

    - name: Lint Helm chart
      shell: bash
      env:
        CHART_FOLDER: ${{ inputs.chart-folder }}
      run: helm lint "$CHART_FOLDER"

    - name: Package and push chart (OCI)
      uses: bsord/helm-push@v4.1.0
      with:
        useOCIRegistry: true
        registry-url: ${{ inputs.registry-url }}
        username: ${{ inputs.username }}
        access-token: ${{ inputs.access-token }}
        force: ${{ inputs.force }}
        chart-folder: ${{ inputs.chart-folder }}

    - name: Restore Chart.yaml after override
      if: inputs.chart-version != '' && always()
      shell: bash
      env:
        CHART_FOLDER: ${{ inputs.chart-folder }}
      run: |
        set -euo pipefail
        chart_yaml="${CHART_FOLDER}/Chart.yaml"
        if [ -f "${chart_yaml}.pre-oci-publish.bak" ]; then
          mv -- "${chart_yaml}.pre-oci-publish.bak" "$chart_yaml"
        fi
